<!doctype html>
<meta charset="utf-8">
<title>strudle</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 1rem; max-width: 64rem; }
  .bar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: .5rem; }
  textarea { width: 100%; height: 26rem; font: 13px/1.4 ui-monospace, Consolas, monospace; box-sizing: border-box; }
  #err { color: #b00; white-space: pre-wrap; }
  #status { color: #555; }
  kbd { font: inherit; color: #777; }
</style>
<div class="bar">
  <select id="song"></select>
  <button id="play">&#9654; play</button>
  <button id="pause">&#10074;&#10074; pause</button>
  <button id="stop">&#9632; stop</button>
  <label id="scrub" hidden><input id="pos" type="range" min="0" max="1" step="0.05" list="marks" style="width:16rem;vertical-align:middle"><datalist id="marks"></datalist> <span id="where"></span></label>
  <button id="save">save</button>
  <button id="export">export mp3</button>
  <button id="dump">export strudel</button>
  <span id="status"></span>
  <kbd>ctrl+enter play &middot; ctrl+. stop</kbd>
</div>
<textarea id="code" spellcheck="false"></textarea>
<pre id="err"></pre>
<script src="/node_modules/@strudel/web/dist/index.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let loaded = '';      // text as last loaded from disk (or saved)
  let playing = false;
  let sections = []; // of the song last evaluated, for the scrubber
  let paused = null; // cycle to resume from; the worker clock resets to 0 on stop, so pause must remember it

  const ready = initStrudel({
    sync: true, // worker clock: the only scheduler with setCycle (section jump)
    onEvalError: (e) => ($('err').textContent = e.message),
    prebake: async () => {
      const packs = await fetch('/samples/packs/packs.json').then((r) => (r.ok ? r.json() : []));
      await Promise.all([
        ...packs.map((p) => strudel.samples(`/samples/packs/${p}.json`)),
        strudel.samples('/samples/user/strudel.json'),
      ]);
      if (packs.includes('tidal-drum-machines')) strudel.aliasBank('/samples/packs/tidal-drum-machines-alias.json');
      await import('/lib/index.mjs');
      $('status').textContent = `packs: ${packs.join(', ') || 'none (run npm run samples)'}`;
    },
  });

  // surface strudel's own error log lines (e.g. "sound not found")
  document.addEventListener('strudel.log', (e) => {
    if (e.detail.type === 'error') $('err').textContent = e.detail.message;
  });

  async function loadList() {
    const names = await (await fetch('/songs')).json();
    $('song').innerHTML = names.map((n) => `<option>${n}</option>`).join('');
    const want = decodeURIComponent(location.hash.slice(1));
    if (names.includes(want)) $('song').value = want;
    await loadSong();
  }
  async function loadSong() {
    const name = $('song').value;
    location.hash = name;
    loaded = await (await fetch(`/songs/${name}`)).text();
    $('code').value = loaded;
    $('err').textContent = '';
  }
  async function play() {
    $('err').textContent = '';
    await ready;
    const pat = await strudel.evaluate($('code').value);
    if (pat?.strudle) setcps(pat.strudle.meta.cps); // song() files carry their tempo in metadata; render and export already honour it
    playing = true;
    sections = pat?.strudle?.sections ?? []; // only song() files have sections to scrub through
    $('scrub').hidden = !sections.length;
    $('pos').max = pat?.strudle?.total ?? 1;
    $('marks').innerHTML = sections.map((s) => `<option value="${s.offset}" label="${s.name}">`).join(''); // tick marks at section starts
    if (paused != null) { (await ready).scheduler.setCycle(paused); paused = null; }
    console.log('[strudle] evaluated', $('song').value);
  }
  function stop() { strudel.hush(); playing = false; paused = null; }
  async function pause() {
    if (!playing) return play(); // resumes from `paused` if set
    paused = (await ready).scheduler.now();
    strudel.hush(); playing = false;
  }
  async function save() {
    await fetch(`/songs/${$('song').value}`, { method: 'PUT', body: $('code').value });
    loaded = $('code').value;
    $('status').textContent = 'saved';
  }

  $('play').onclick = play;
  $('pause').onclick = pause;
  $('stop').onclick = stop;
  $('pos').oninput = async (e) => {
    paused = null;
    if (!playing) await play();
    (await ready).scheduler.setCycle(Number(e.target.value)); // clock worker jumps; already-sounding notes keep ringing
  };
  setInterval(async () => { // follow the clock: slider position + "section · cycle/total"
    if (!sections.length) return;
    const c = playing ? (await ready).scheduler.now() : paused ?? 0; // now() drifts after stop
    if (document.activeElement !== $('pos')) $('pos').value = c; // don't yank the knob mid-drag
    const s = sections.findLast((x) => x.offset <= c);
    $('where').textContent = `${s?.name ?? '…'} · ${c.toFixed(1)}/${$('pos').max}`;
  }, 250);
  $('save').onclick = save;
  $('export').onclick = async () => {
    const song = $('song').value;
    await strudel.getAudioContext().resume(); // this click is the gesture that lets the live context finish loading its worklets
    renderToServer({ song, name: song.replace(/\.strudel$/, ''), mp3: true });
  };
  $('dump').onclick = async () => {
    const song = $('song').value;
    $('status').textContent = `dumping ${song}…`;
    const r = await fetch(`/dump/${song}`, { method: 'POST' });
    if (!r.ok) { $('status').textContent = `dump failed: ${await r.text()}`; return; }
    const { path, code } = await r.json();
    const url = `https://strudel.cc/#${strudel.code2hash(code)}`;
    $('status').innerHTML = `wrote ${path} · <a href="${url}" target="_blank">open in strudel.cc</a>`;
    window.open(url, '_blank'); // popup blockers may eat this; the status link is the fallback
  };
  $('song').onchange = loadSong;
  $('code').addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); play(); }
    if ((e.ctrlKey || e.metaKey) && e.key === '.') { e.preventDefault(); stop(); }
  });

  // reload from disk when the current song file changes (fs.watch fires twice on Windows, hence the debounce)
  let timer;
  new EventSource('/events').onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.render) return renderToServer(msg.render);
    if (msg.changed !== $('song').value) return;
    clearTimeout(timer);
    timer = setTimeout(async () => {
      if ($('code').value !== loaded) {
        $('status').innerHTML = 'file changed on disk. <a href="#" id="reload">reload</a>';
        $('reload').onclick = async (ev) => { ev.preventDefault(); await loadSong(); $('status').textContent = ''; if (playing) play(); };
        return;
      }
      await loadSong();
      if (playing) play();
    }, 200);
  };

  async function renderToServer({ song, cycles, section, layer, name, mp3 }) {
    const fail = (message) => { $('status').textContent = message; return fetch('/render-error', { method: 'POST', body: JSON.stringify({ name, message }) }); };
    $('status').textContent = `rendering ${name}…`;
    if (playing) return fail('page is playing; stop first (render replaces the audio context)');
    try {
      await ready;
      const code = await (await fetch(`/songs/${song}`)).text();
      let pat = await strudel.evaluate(code, false);
      let begin = 0, end = cycles ?? (pat.strudle ? pat.strudle.total : 8);
      // read cps off the song pattern before a layer selector replaces it with a sub-pattern that has no .strudle
      const cps = pat.strudle?.meta.cps ?? 0.5;
      if (section || layer) {
        if (layer && !section) return fail('layer requires --section');
        const s = pat.strudle?.sections.find((x) => x.name === section);
        if (section && !s) return fail(`no section "${section}"`);
        if (layer) {
          const src = s.layers[layer];
          if (!src) return fail(`no layer "${layer}" in section "${section}"`);
          pat = src.pattern; begin = 0; end = cycles ?? s.cycles;
        } else { begin = s.offset; end = s.offset + (cycles ?? s.cycles); }
      }
      const blob = await renderWav(pat, cps, begin, end);
      const out = await (await fetch(`/renders/${name}.wav${mp3 ? '?mp3' : ''}`, { method: 'PUT', body: blob })).text();
      $('status').textContent = `rendered ${out} (${(end - begin)} cycles)`;
    } catch (e) {
      fail(e.message);
      // the render stubs/audio context may be half-torn-down: say so instead of looking idle
      $('status').textContent = `render failed: ${e.message}. Reload the page before playing.`;
      $('err').textContent = e.message;
    }
  }

  // Offline render, one cycle at a time. strudel.renderPatternAudio builds every event's node chain up front and
  // Chrome runs the whole graph every quantum, so a long dense song renders ~40x slower than realtime. Suspending
  // the context at each cycle boundary and scheduling only that cycle keeps the live graph to what is sounding.
  async function renderWav(pat, cps, begin, end) {
    const live = strudel.getAudioContext();
    // a pending worklet load on the live context is aborted by close() and strudel caches the failure forever
    if (live.state === 'running') await strudel.initAudio();
    await live.close();
    const rate = 44100;
    const ctx = new OfflineAudioContext(2, Math.ceil((end - begin) / cps * rate), rate);
    strudel.setAudioContext(ctx);
    strudel.resetGlobalEffects();
    strudel.setSuperdoughAudioController(null); // rebuilt lazily on the offline context
    await strudel.initAudio({ maxPolyphony: 128 });
    const schedule = async (from, to) => {
      for (const h of pat.queryArc(from, to, { _cps: cps })) {
        if (!h.hasOnset()) continue;
        h.ensureObjectValue();
        const at = (h.whole.begin.valueOf() - begin) / cps;
        try { await strudel.superdough(h.value, at, h.duration / cps, cps, at); } catch (e) { console.warn('[render]', e.message); }
      }
    };
    try {
      const starts = [];
      for (let b = begin + 1; b < end; b++) starts.push(b);
      const suspends = starts.map((b) => ctx.suspend((b - begin) / cps - 0.05)); // a hair early: the cycle's first onset must still be ahead
      await schedule(begin, Math.min(begin + 1, end));
      const done = ctx.startRendering();
      for (let i = 0; i < starts.length; i++) {
        await suspends[i];
        await schedule(starts[i], Math.min(starts[i] + 1, end));
        await ctx.resume();
      }
      return toWav(await done);
    } finally {
      strudel.resetGlobalEffects();
      strudel.setSuperdoughAudioController(null);
      strudel.setAudioContext(null); // strudel makes a fresh live context on next use
    }
  }
  function toWav(buf) { // 16-bit PCM, interleaved
    const n = buf.length, ch = buf.numberOfChannels, bytes = n * ch * 2, v = new DataView(new ArrayBuffer(44 + bytes));
    const tag = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    tag(0, 'RIFF'); v.setUint32(4, 36 + bytes, true); tag(8, 'WAVEfmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, ch, true); v.setUint32(24, buf.sampleRate, true);
    v.setUint32(28, buf.sampleRate * ch * 2, true); v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true);
    tag(36, 'data'); v.setUint32(40, bytes, true);
    const chans = Array.from({ length: ch }, (_, c) => buf.getChannelData(c));
    for (let i = 0, o = 44; i < n; i++) for (const c of chans) { const s = Math.max(-1, Math.min(1, c[i])); v.setInt16(o, s < 0 ? s * 32768 : s * 32767, true); o += 2; }
    return new Blob([v], { type: 'audio/wav' });
  }

  loadList();
</script>
