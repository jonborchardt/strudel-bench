<!doctype html>
<meta charset="utf-8">
<title>strudle</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 1rem; max-width: 64rem; }
  .bar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: .5rem; }
  textarea { width: 100%; height: 26rem; font: 13px/1.4 ui-monospace, Consolas, monospace; box-sizing: border-box; }
  #err { color: #b00; white-space: pre-wrap; }
  #status { color: #555; }
  kbd { font: inherit; color: #777; }
</style>
<div class="bar">
  <select id="song"></select>
  <button id="play">&#9654; play</button>
  <button id="stop">&#9632; stop</button>
  <button id="save">save</button>
  <span id="status"></span>
  <kbd>ctrl+enter play &middot; ctrl+. stop</kbd>
</div>
<textarea id="code" spellcheck="false"></textarea>
<pre id="err"></pre>
<script src="/node_modules/@strudel/web/dist/index.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let loaded = '';      // text as last loaded from disk (or saved)
  let playing = false;

  const ready = initStrudel({
    onEvalError: (e) => ($('err').textContent = e.message),
    prebake: async () => {
      const packs = await fetch('/samples/packs/packs.json').then((r) => (r.ok ? r.json() : []));
      await Promise.all([
        ...packs.map((p) => strudel.samples(`/samples/packs/${p}.json`)),
        strudel.samples('/samples/user/strudel.json'),
      ]);
      if (packs.includes('tidal-drum-machines')) strudel.aliasBank('/samples/packs/tidal-drum-machines-alias.json');
      await import('/lib/index.mjs');
      $('status').textContent = `packs: ${packs.join(', ') || 'none (run npm run samples)'}`;
    },
  });

  // surface strudel's own error log lines (e.g. "sound not found")
  document.addEventListener('strudel.log', (e) => {
    if (e.detail.type === 'error') $('err').textContent = e.detail.message;
  });

  async function loadList() {
    const names = await (await fetch('/songs')).json();
    $('song').innerHTML = names.map((n) => `<option>${n}</option>`).join('');
    const want = decodeURIComponent(location.hash.slice(1));
    if (names.includes(want)) $('song').value = want;
    await loadSong();
  }
  async function loadSong() {
    const name = $('song').value;
    location.hash = name;
    loaded = await (await fetch(`/songs/${name}`)).text();
    $('code').value = loaded;
    $('err').textContent = '';
  }
  async function play() {
    $('err').textContent = '';
    await ready;
    await strudel.evaluate($('code').value);
    playing = true;
    console.log('[strudle] evaluated', $('song').value);
  }
  function stop() { strudel.hush(); playing = false; }
  async function save() {
    await fetch(`/songs/${$('song').value}`, { method: 'PUT', body: $('code').value });
    loaded = $('code').value;
    $('status').textContent = 'saved';
  }

  $('play').onclick = play;
  $('stop').onclick = stop;
  $('save').onclick = save;
  $('song').onchange = loadSong;
  $('code').addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); play(); }
    if ((e.ctrlKey || e.metaKey) && e.key === '.') { e.preventDefault(); stop(); }
  });

  // reload from disk when the current song file changes (fs.watch fires twice on Windows, hence the debounce)
  let timer;
  new EventSource('/events').onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.render) return renderToServer(msg.render);
    if (msg.changed !== $('song').value) return;
    clearTimeout(timer);
    timer = setTimeout(async () => {
      if ($('code').value !== loaded) {
        $('status').innerHTML = 'file changed on disk. <a href="#" id="reload">reload</a>';
        $('reload').onclick = async (ev) => { ev.preventDefault(); await loadSong(); $('status').textContent = ''; if (playing) play(); };
        return;
      }
      await loadSong();
      if (playing) play();
    }, 200);
  };

  async function renderToServer({ song, cycles, section, layer, name }) {
    const fail = (message) => fetch('/render-error', { method: 'POST', body: JSON.stringify({ name, message }) });
    if (playing) return fail('page is playing; stop first (render replaces the audio context)');
    try {
      await ready;
      const code = await (await fetch(`/songs/${song}`)).text();
      let pat = await strudel.evaluate(code, false);
      let begin = 0, end = cycles ?? (pat.strudle ? pat.strudle.total : 8);
      // read cps off the song pattern before a layer selector replaces it with a sub-pattern that has no .strudle
      const cps = pat.strudle?.meta.cps ?? 0.5;
      if (section || layer) {
        if (layer && !section) return fail('layer requires --section');
        const s = pat.strudle?.sections.find((x) => x.name === section);
        if (section && !s) return fail(`no section "${section}"`);
        if (layer) {
          const src = s.layers[layer];
          if (!src) return fail(`no layer "${layer}" in section "${section}"`);
          pat = src.pattern; begin = 0; end = cycles ?? s.cycles;
        } else { begin = s.offset; end = s.offset + (cycles ?? s.cycles); }
      }
      let blob = null;
      const origCreate = URL.createObjectURL, origClick = HTMLAnchorElement.prototype.click;
      URL.createObjectURL = (b) => { blob = b; return 'blob:captured'; };
      HTMLAnchorElement.prototype.click = function () {};
      try { await strudel.renderPatternAudio(pat, cps, begin, end, 44100, 128, false, name); }
      finally { URL.createObjectURL = origCreate; HTMLAnchorElement.prototype.click = origClick; }
      if (!blob) return fail('renderer produced no file');
      await fetch(`/renders/${name}.wav`, { method: 'PUT', body: blob });
      $('status').textContent = `rendered ${name}.wav (${(end - begin)} cycles)`;
    } catch (e) {
      fail(e.message);
      // the render stubs/audio context may be half-torn-down: say so instead of looking idle
      $('status').textContent = `render failed: ${e.message}. Reload the page before playing.`;
      $('err').textContent = e.message;
    }
  }

  loadList();
</script>
