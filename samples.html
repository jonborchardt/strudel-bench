<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>strudel-bench · samples</title>
<meta name="description" content="Make and audition sample definitions: trim a region, count the bars, cut the slices, save it into the pack so any song can name it.">
<!-- local only: this page writes samples/user/, so it is never deployed and never indexed -->
<meta name="robots" content="noindex">
<link rel="icon" href="web/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="web/strudel.css">
<nav class="top" id="nav"></nav>
<main class="workshop">
  <!-- left: the local packs, each with its definitions and its sounds; a new-pack form and, on the selected pack, a drop target -->
  <aside class="card" id="packs">
    <h2>Packs</h2>
    <div id="packlist"></div>
    <form id="newpack">
      <h3>+ new pack</h3>
      <input id="pname" placeholder="pack name" autocomplete="off" required>
      <input id="plic" placeholder="license (blank = local only)" autocomplete="off" value="CC0-1.0">
      <button type="submit">Make pack</button>
    </form>
  </aside>

  <!-- right: one definition. The waveform carries the region and the slice lines; every control below edits the definition and redraws. -->
  <section class="card rack" id="editor" hidden>
    <canvas id="wave" width="1400" height="160"></canvas>
    <div class="info" id="detect"></div>
    <div class="matrow"><b>Name</b>
      <label>name <input id="name" class="snd" autocomplete="off" title="the name a song writes as sample.sound"></label>
      <label>sound <select id="sound" title="the pack sound this definition plays"></select></label>
      <label>start <input id="begin" class="snd num" type="number" min="0" step=".001" title="seconds into the file (drag the left line too)"></label>
      <label>end <input id="end" class="snd num" type="number" min="0" step=".001" title="seconds into the file (drag the right line too)"></label>
    </div>
    <div class="matrow"><b>Form</b>
      <label>bars <input id="bars" class="snd num" type="number" min=".01" step=".125" title="how many bars the region stands for at the section tempo"></label>
      <label>slices <input id="slices" class="snd num" type="number" min="1" step="1" title="equal slices of the region; typing here clears the break points"></label>
      <label>breaks <input id="breaks" class="snd wide" autocomplete="off" title="break points in seconds into the file, space-separated; empty = equal slices. Click the waveform to add one, click a line to remove it, drag one to move it."></label>
      <label class="snap">snap <select id="snap" title="where a dragged or clicked break lands; this browser's setting, never saved"></select></label>
      <label>stretch <input id="stretch" type="checkbox" title="fit each slice to its step instead of playing it at its own length"></label>
    </div>
    <div class="matrow"><b>Audition</b>
      <label>pattern <input id="pattern" class="snd wide" autocomplete="off" placeholder="every slice in order" title="slice indices in mini-notation, spanning the sample's bars"></label>
      <label>bpm <input id="bpm" class="snd num" type="number" min="20" max="300" step="1" title="tempo to audition at; a page setting, never saved"></label>
      <button id="region" title="play the region at its natural speed">&#9654; region</button>
      <button id="playpat" title="play the test pattern through the sample part">&#9654; pattern</button>
      <span class="slices" id="slicebtns"></span>
    </div>
    <div class="matrow"><b>Pack</b>
      <button id="save" title="write this definition into the pack's pack.json">Save</button>
      <button id="dup" title="save a copy under the next free numbered name">Duplicate</button>
      <button id="del" title="remove this definition from the pack">Delete</button>
      <label class="pvlvl" title="how loud the previews play; not saved">preview level <input class="pvin" type="range" min="-1" max="1.7" step=".01" value="0"><output>x1.0</output></label>
    </div>
    <div class="wstatus" id="wstatus" role="status" aria-live="polite"></div>
  </section>
</main>
<footer class="site" id="foot"></footer>
<script src="node_modules/@strudel/web/dist/index.js"></script>
<script type="module">
  import { boot, nav, footer, localPacks } from './web/boot.mjs';
  import { registerSamples } from './lib/packs.mjs';
  import { peaks, fmtTime, soundUrl, frac, breaksIn, breakPoints, SNAPS, snapDivisions, detectTempo, barsGuess } from './web/sampler.mjs';
  import { createWaveform } from './web/waveform.mjs';
  import { slicePoints } from './lib/layers.mjs';
  import { defText, packJsonWith, nameProblem } from './web/workshop.mjs';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('"', '&quot;');
  $('nav').innerHTML = nav('Samples');
  $('nav').querySelector('a[href="samples.html"]').hidden = false; // only the dev server serves this page, so its link is always live here
  $('foot').innerHTML = footer();
  const status = (text) => ($('wstatus').textContent = text);
  const ready = boot({ onError: status, onStatus: (t) => ($('status').textContent = t) });

  // ---- state: one definition being edited, plus the two page settings (test pattern and tempo) that are never saved
  let cur = null;   // { pack, name, def: { sound, begin, end, bars, slices, stretch } }
  let dur = 0;      // the decoded sound's duration in seconds (0 = nothing decoded, so the seconds boxes are off)
  let pattern = ''; // the test pattern; empty = every slice in order, which is what an unwritten part plays
  let bpm = Number(localStorage.getItem('strudel:wsbpm')) || 120;
  let pvGain = Number(localStorage.getItem('strudel:pvlvl')) || 1;
  let token = 0;    // a render's turn: a decode that finishes after a newer render must not draw over it
  const cps = () => bpm / 240; // 4/4: one cycle is one bar
  const blank = (sound = '') => ({ sound, begin: 0, end: 1, bars: 1, slices: 1, stretch: false });
  const snapSetting = () => { const s = localStorage.getItem('strudel:snap'); return Object.hasOwn(SNAPS, s) ? s : '1/16'; };
  $('snap').innerHTML = Object.keys(SNAPS).map((k) => `<option${k === snapSetting() ? ' selected' : ''}>${k}</option>`).join('');

  const bufs = new Map(); // sound name -> promise of its AudioBuffer (decoding a long file twice per redraw is the one cost worth caching)
  function bufferOf(sound) {
    if (!bufs.has(sound)) bufs.set(sound, (async () => {
      const url = soundUrl(strudel.soundMap.get(), sound);
      if (!url) throw new Error(`no file behind "${sound}" (not loaded?)`);
      return strudel.getAudioContext().decodeAudioData(await (await fetch(url)).arrayBuffer());
    })().catch((e) => { bufs.delete(sound); throw e; }));
    return bufs.get(sound);
  }
  const tempos = new Map(); // `sound|begin|end` -> its detection: autocorrelation costs, and a redraw must not pay it again
  function tempoOf(buf, sound, begin, end) {
    const k = `${sound}|${begin}|${end}`;
    if (!tempos.has(k)) tempos.set(k, detectTempo(buf.getChannelData(0), buf.sampleRate, begin, end));
    return tempos.get(k);
  }

  // ---- the pack list: definitions first, then the pack's sounds, then anything the server refused to read
  function listPacks() {
    const entries = Object.entries(localPacks);
    $('packlist').innerHTML = entries.length ? entries.map(([p, x]) => {
      const row = (n, kind) => `<li class="${kind}${cur?.pack === p && cur?.kind === kind && cur?.name === n ? ' sel' : ''}"><button data-pack="${esc(p)}" data-${kind}="${esc(n)}">${esc(n)}</button></li>`;
      // a sound with a definition of its own name is listed once, as that definition: the definition *is* the sound's
      // default interpretation, and a blank row next to it invites saving {} over it
      const rows = [...Object.keys(x.samples ?? {}).sort().map((n) => row(n, 'def')),
        ...Object.keys(x.sounds ?? {}).filter((n) => !Object.hasOwn(x.samples ?? {}, n)).sort().map((n) => row(n, 'snd')),
        ...(x.problems ?? []).map((t) => `<li class="bad">${esc(t)}</li>`)];
      return `<section class="wpack${cur?.pack === p ? ' on' : ''}"><h3><button data-pack="${esc(p)}">${esc(p)}</button><small>${x.deploy ? 'deployed' : 'local'}</small></h3><ul>${rows.join('')}</ul>`
        + (cur?.pack === p ? '<div class="drop">drop audio here<input type="file" id="file" accept="audio/*"></div>' : '') + '</section>';
    }).join('') : '<p class="muted">no local packs yet</p>';
  }
  async function refreshPacks() { // the index is the truth: a pack or a definition may have gone away, so stale keys are dropped
    const idx = await (await fetch('samples/user/packs.json', { cache: 'no-store' })).json();
    for (const k of Object.keys(localPacks)) if (!(k in idx)) delete localPacks[k];
    Object.assign(localPacks, idx);
    registerSamples(localPacks);
  }
  // `kind` is which row is selected ('def' | 'snd' | ''), `from` the definition the editor was loaded from: a save
  // under any other name is a new definition, and must ask before it lands on one that already exists
  const selectPack = (p) => { cur = { pack: p, name: '', kind: '', from: null, def: blank(Object.keys(localPacks[p]?.sounds ?? {})[0] ?? '') }; render(); }; // an unnamed definition on the pack's first sound: the select and the waveform agree from the start
  const selectSound = (p, n) => { cur = { pack: p, name: n, kind: 'snd', from: null, def: blank(n) }; render(); }; // a plain sound is the whole file as one bar
  const selectDef = (p, n) => { cur = { pack: p, name: n, kind: 'def', from: n, def: { ...blank(n), ...localPacks[p].samples[n] } }; render(); };

  // ---- the editor: every control reads into cur.def, then render() writes the whole form, the waveform and the buttons back
  const wave = createWaveform($('wave'), {
    onStatus: status,
    onCommit: (c) => {
      if (c.breaks) cur.def.slices = c.breaks.length ? c.breaks : 1;
      else { // a region drag: break points it now leaves outside go with it, as they must to stay a legal definition
        cur.def.begin = c.begin; cur.def.end = c.end;
        if (Array.isArray(cur.def.slices)) { const kept = breaksIn(cur.def.slices, c.begin, c.end); cur.def.slices = kept.length ? kept : 1; }
      }
      render();
    },
  });
  const set = (el, v) => { if (el !== document.activeElement) el.value = v; }; // a box being typed in is left alone

  async function render() {
    listPacks();
    $('editor').hidden = !cur;
    if (!cur) return;
    const d = cur.def, mine = ++token;
    const count = Array.isArray(d.slices) ? d.slices.length + 1 : d.slices;
    set($('name'), cur.name);
    if ($('sound') !== document.activeElement) $('sound').innerHTML = Object.keys(localPacks[cur.pack]?.sounds ?? {}).sort().map((n) => `<option${n === d.sound ? ' selected' : ''}>${esc(n)}</option>`).join('')
      || '<option value="">(no sounds: drop audio into this pack)</option>'; // a rebuild while it has focus would drop the keyboard pick
    set($('bars'), d.bars); set($('slices'), count); set($('pattern'), pattern); set($('bpm'), bpm);
    $('stretch').checked = !!d.stretch;
    $('slicebtns').innerHTML = Array.from({ length: count }, (_, i) => `<button class="sl" data-slice="${i}" title="play slice ${i} alone">${i}</button>`).join('');
    let buf = null;
    if (d.sound) { try { buf = await bufferOf(d.sound); } catch (e) { status(e.message); } }
    if (mine !== token) return; // a newer render took over while this one decoded
    dur = buf?.duration ?? 0;
    for (const id of ['begin', 'end']) $(id).disabled = !dur;
    set($('begin'), dur ? +(d.begin * dur).toFixed(3) : d.begin);
    set($('end'), dur ? +(d.end * dur).toFixed(3) : d.end);
    set($('breaks'), !Array.isArray(d.slices) ? '' : dur ? d.slices.map((f) => +(f * dur).toFixed(3)).join(' ') : d.slices.map(frac).join(' '));
    wave.set({
      peaks: buf ? peaks(buf.getChannelData(0), $('wave').width) : null, duration: dur,
      begin: d.begin, end: d.end, breaks: Array.isArray(d.slices) ? d.slices : null, count,
      divisions: snapDivisions(d.bars, 4, SNAPS[$('snap').value]),
    });
    // what the region sounds like it is: the detected tempo, the bar count that implies, and a button to take it
    const { bpm: exact, confidence } = buf ? tempoOf(buf, d.sound, d.begin, d.end) : { bpm: 0, confidence: 0 };
    const guess = exact && barsGuess((d.end - d.begin) * dur, exact, 4);
    $('detect').innerHTML = buf
      ? esc(`${fmtTime(dur)} · ${buf.numberOfChannels === 2 ? 'stereo' : 'mono'} · region ${fmtTime((d.end - d.begin) * dur)} as ${d.bars} bar${d.bars === 1 ? '' : 's'}`)
        + (exact ? ` <span class="${confidence < .3 ? 'unsure' : ''}" title="detected from the region's onsets">&middot; &asymp; ${Math.round(exact)} bpm &middot; ${guess} bars?${confidence < .3 ? ' (unsure)' : ''}</span>`
          + ` <button class="pick" data-bars="${guess}" title="this definition's bars: ${guess}">use</button>` : '')
      : 'pick a sound, or drop audio into the pack';
  }

  function readForm(el) {
    const d = cur.def;
    cur.name = $('name').value.trim();
    d.sound = $('sound').value;
    if (dur) {
      const b = Math.min(Math.max(Number($('begin').value) / dur, 0), 1), e = Math.min(Math.max(Number($('end').value) / dur, 0), 1);
      if (b < e) { d.begin = +b.toFixed(4); d.end = +e.toFixed(4); } else status('start must be before end');
    }
    d.bars = Math.max(.01, Number($('bars').value) || 1);
    d.stretch = $('stretch').checked;
    if (el?.id === 'slices') $('breaks').value = ''; // the count and the break points are two ways to say the same thing: the one just typed wins
    const secs = $('breaks').value.trim().split(/[\s,]+/).filter(Boolean).map(Number);
    if (!secs.length) d.slices = Math.max(1, Math.round(Number($('slices').value) || 1));
    else if (!dur) status('break points need the audio decoded');
    else if (secs.some((n) => !Number.isFinite(n))) status('breaks: seconds into the file, space-separated');
    else { const fr = breakPoints(secs, dur, d.begin, d.end); if (typeof fr === 'string') status(fr); else d.slices = fr; }
    pattern = $('pattern').value.trim();
    bpm = Math.min(300, Math.max(20, Math.round(Number($('bpm').value) || 120)));
    localStorage.setItem('strudel:wsbpm', bpm);
    localStorage.setItem('strudel:snap', $('snap').value);
    render();
  }
  $('editor').onchange = (e) => { if (cur) readForm(e.target); };

  // ---- auditioning, the same shape as the Compose page's previews: the same button again stops, another replaces it
  let pvTimer, pvBtn;
  async function preview(btn, build) {
    clearTimeout(pvTimer); pvBtn?.classList.remove('on');
    if (pvBtn === btn) { pvBtn = null; strudel.hush(); return; }
    pvBtn = btn;
    const r = await ready;
    strudel.hush();
    await strudel.getAudioContext().resume(); // this ▶ may be the page's first click: the context starts suspended until a gesture resumes it
    let p; try { p = build(); } catch (e) { status(e.message); pvBtn = null; return; }
    btn.classList.add('on');
    status(`hearing ${p.what}${pvGain === 1 ? '' : ` at x${pvGain}`}`);
    r.setCps(p.cps); r.setPattern(p.pattern.mul(strudel.gain(pvGain)), true); // the repl's own setCps: the `setcps` global needs an evaluated song
    pvTimer = setTimeout(() => { strudel.hush(); btn.classList.remove('on'); pvBtn = null; }, (p.cycles * 1000) / p.cps + 200);
  }
  // one piece of the file at its natural speed, long enough not to retrigger (what a slice sounds like on its own)
  const playPoints = (btn, pts, i, what) => preview(btn, () => {
    if (!cur.def.sound) throw new Error('pick a sound first');
    if (i >= pts.length - 1) throw new Error(`no slice ${i}`);
    return { pattern: strudel.s(cur.def.sound).begin(pts[i]).end(pts[i + 1]).speed((cps() * (pts.at(-1) - pts[0])) / cur.def.bars).unit('c').slow(2), cps: cps(), cycles: 2, what };
  });
  // the definition as a song would hear it: the sample part itself, over the bars it claims, at the page's tempo
  const playPattern = (btn) => preview(btn, () => {
    if (!cur.def.sound) throw new Error('pick a sound first');
    const cycles = cur.def.bars; // the section is exactly the sample's bars, fractional ones included, so a sub-bar definition plays once
    const attrs = { ...cur.def, ...(pattern ? { pattern } : {}) };
    return { pattern: window.sample(attrs, { cps: cps(), cycles, key: 'C:minor', seed: 1, kit: 'RolandTR909' }), cps: cps(), cycles, what: `${cur.name || cur.def.sound} at ${bpm} bpm` };
  });

  // ---- the pack file: one definition in, one out; the index is re-read so the list and the registry follow
  const packMeta = async (pack) => { const r = await fetch(`samples/user/${pack}/pack.json`, { cache: 'no-store' }); return r.ok ? r.json() : {}; };
  async function write(name, def) {
    const problem = def && nameProblem(name, cur.pack, localPacks);
    if (problem) return status(problem);
    const had = localPacks[cur.pack]?.samples?.[name];
    // overwriting someone else's definition (a rename, a fresh edit) or removing one is worth a question: there is no undo here
    if (def && had && name !== cur.from && !confirm(`replace the existing definition "${name}" in ${cur.pack}?`)) return status('not saved');
    if (!def && !had) return status(`no definition "${name}" in ${cur.pack}`);
    if (!def && !confirm(`delete the definition "${name}" from ${cur.pack}?`)) return status('not deleted');
    const next = packJsonWith(await packMeta(cur.pack), name, def);
    const r = await fetch(`samples/user/${cur.pack}/pack.json`, { method: 'PUT', body: JSON.stringify(next, null, 2) });
    if (!r.ok) return status(await r.text());
    await refreshPacks();
    if (def) { Object.assign(cur, { name, kind: 'def', from: name }); render(); status(`saved ${cur.pack}/${name}`); }
    else { selectSound(cur.pack, cur.def.sound); status(`deleted ${cur.pack}/${name}`); }
  }
  const save = () => write(cur.name, defText(cur.name, cur.def));
  function duplicate() { // the next free numbered name, as the arrangement strip's duplicate does for a section
    const base = cur.name.replace(/\d+$/, '') || cur.def.sound;
    let n = 2; while (localPacks[cur.pack]?.samples?.[`${base}${n}`]) n++;
    return write(`${base}${n}`, defText(`${base}${n}`, cur.def));
  }

  async function importFile(file) {
    try {
      const dot = file.name.lastIndexOf('.');
      if (dot < 1) return status('the file needs an extension (wav, mp3, ...)');
      const ext = file.name.slice(dot).toLowerCase(), name = file.name.slice(0, dot).replace(/[^\w-]/g, '_').toLowerCase();
      if (!name) return status('the file needs a name');
      status(`importing ${file.name}…`);
      // superdough caches decoded buffers by url, so a re-import under a known name keeps playing the old audio until a reload
      const replaced = name in strudel.soundMap.get();
      const r = await fetch(`samples/user/${cur.pack}/${name}${ext}`, { method: 'PUT', body: file });
      if (!r.ok) return status(await r.text());
      await strudel.samples(await (await fetch('samples/user/strudel.json', { cache: 'no-store' })).json()); // the map carries its own _base
      await refreshPacks();
      bufs.delete(name);
      for (const k of tempos.keys()) if (k.startsWith(`${name}|`)) tempos.delete(k); // the file behind the name changed: so does what it was detected as
      selectSound(cur.pack, name);
      status(`imported ${file.name} → samples/user/${cur.pack}/${name}${ext}${replaced ? ' (replaced: reload to hear the new file)' : ''}`);
    } catch (e) { status(e.message); }
  }

  // ---- wiring
  $('packlist').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const { pack, def, snd } = b.dataset;
    if (def) selectDef(pack, def); else if (snd) selectSound(pack, snd); else if (pack) selectPack(pack);
  };
  // the drop target doubles as a file picker (cleared so re-picking the same file fires change again)
  $('packlist').onchange = (e) => { if (e.target.id === 'file') { const f = e.target.files[0]; e.target.value = ''; if (f) importFile(f); } };
  $('packlist').ondragover = (e) => { if (e.target.closest('.drop')) e.preventDefault(); };
  $('packlist').ondrop = (e) => { const f = e.dataTransfer?.files[0]; if (e.target.closest('.drop') && f) { e.preventDefault(); importFile(f); } };
  $('editor').onclick = (e) => {
    const b = e.target.closest('button'); if (!b || !cur) return;
    const d = cur.def;
    if (b.dataset.bars) { d.bars = Number(b.dataset.bars); render(); }
    else if (b.dataset.slice) playPoints(b, slicePoints(d.begin, d.end, d.slices), Number(b.dataset.slice), `slice ${b.dataset.slice} of ${d.sound}`);
    else if (b.id === 'region') playPoints(b, [d.begin, d.end], 0, `region of ${d.sound}`);
    else if (b.id === 'playpat') playPattern(b);
    else if (b.id === 'save') save();
    else if (b.id === 'dup') duplicate();
    else if (b.id === 'del') write(cur.name, null);
  };
  $('newpack').onsubmit = async (e) => {
    e.preventDefault();
    const name = $('pname').value.trim().toLowerCase(), license = $('plic').value.trim();
    if (!/^[\w-]+$/.test(name)) return status('pack name: letters, digits, - and _ only');
    const body = { deploy: !!license, ...(license ? { license } : {}), source: 'made in the sample workshop' };
    const r = await fetch(`samples/user/${name}/pack.json`, { method: 'PUT', body: JSON.stringify(body, null, 2) });
    if (!r.ok) return status(await r.text());
    await refreshPacks();
    $('pname').value = '';
    selectPack(name);
    status(`made samples/user/${name}/${license ? ` (${license}, deployed)` : ' (local only)'}`);
  };
  // preview level: the same page setting the Compose page keeps, on the same log scale (x0.1 .. x50)
  const pvIn = document.querySelector('input.pvin');
  const showPvGain = () => { pvIn.value = Math.log10(pvGain); pvIn.nextElementSibling.value = `x${pvGain < 10 ? pvGain.toFixed(1) : Math.round(pvGain)}`; };
  pvIn.oninput = () => { pvGain = +(10 ** Number(pvIn.value)).toFixed(2); localStorage.setItem('strudel:pvlvl', pvGain); showPvGain(); };
  showPvGain();
  document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === '.') { e.preventDefault(); strudel.hush(); } });

  ready.then(async () => {
    await refreshPacks();
    const first = Object.keys(localPacks)[0];
    if (first) selectPack(first); else { listPacks(); status('no local packs: make one to start'); }
  });
</script>
