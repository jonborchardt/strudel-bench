<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portrait editor moved</title>
<meta name="robots" content="noindex">
<!-- The editor is a tab of the explorer now. The hash IS the face, and saved links to faces are real artifacts
     (renders/portrait-match/links.md is full of them), so this carries the hash across rather than breaking them.
     Delete this file and those links die. -->
<script>location.replace('limner.html#editor' + (location.hash ? '/' + location.hash.slice(1) : ''));</script>
</head>
<body><p>The portrait editor is now a tab of <a id="l" href="limner.html#editor">the limner explorer</a>.</p>
<script>document.getElementById('l').href = 'limner.html#editor' + (location.hash ? '/' + location.hash.slice(1) : '');</script>
</body>
</html>
