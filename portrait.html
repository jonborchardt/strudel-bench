<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portrait editor</title>
<meta name="description" content="Every parameter of the portrait behind the faces and tableau worlds, on the control that fits it, with the whole face in the URL.">
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; background: #e7e4df; font-family: system-ui, sans-serif; color: #2e2c29; font-size: 13px; }
  main { display: grid; grid-template-columns: 360px 1fr; gap: 16px; align-items: start; padding: 12px; }
  #panel { max-height: calc(100vh - 24px); overflow: auto; background: #f3f1ec; border: 1px solid #cfcac1; border-radius: 6px; padding: 8px; }
  #view { position: sticky; top: 12px; }
  svg { height: min(calc(100vh - 190px), 720px); width: auto; box-shadow: 0 10px 30px rgba(0,0,0,.16); }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  button, select, input, textarea { font: inherit; font-size: 12px; }
  button { padding: 4px 10px; cursor: pointer; }
  details.grp { border-top: 1px solid #ddd8ce; }
  details.grp > summary { cursor: pointer; padding: 6px 2px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; color: #6b655c; }
  .row { display: grid; grid-template-columns: 116px 1fr auto auto; gap: 6px; align-items: center; padding: 1px 2px; border-left: 3px solid transparent; }
  .row > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.ov { border-left-color: #b3202a; background: #fbf4f0; }
  .row input[type=range] { width: 100%; }
  .row output { width: 46px; text-align: right; font-variant-numeric: tabular-nums; color: #6b655c; }
  .nav { display: flex; gap: 2px; }
  .nav button { padding: 0 5px; line-height: 1.5; }
  .row .auto { width: auto; }
  #rep { white-space: pre-wrap; word-break: break-all; background: #f3f1ec; border: 1px solid #cfcac1; padding: 6px; max-height: 40vh; overflow: auto; font-size: 11px; }
  #note { width: 100%; box-sizing: border-box; }
  /* the reference photo: laid over the portrait at a fade, with the three lines a likeness is judged on */
  #stack { position: relative; width: fit-content; overflow: hidden; } /* the reference is clipped to the sheet: a photo hanging off the drawing is not a comparison */
  #refimg, .guide { position: absolute; pointer-events: none; }
  #refimg { top: 0; left: 50%; height: 100%; transform-origin: center; display: none; }
  .guide { left: 0; right: 0; height: 0; border-top: 1px dashed rgba(179,32,42,.75); display: none; }
  .guide span { position: absolute; right: 2px; top: -13px; font-size: 10px; color: #b3202a; }
  #refcard .bar { align-items: center; }
  #refcard label { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; }
  #refcard input[type=range] { width: 88px; }
</style>
</head>
<body>
<main>
  <aside id="panel">
    <div class="bar">
      <button id="rand">randomize</button> <!-- and [ / ] step the seed -->
      <button id="clear">clear edits</button>
      <button id="reset">reset</button>
      <button id="copy">copy link</button>
      <button id="copyimg">copy image</button>
      <label><input type="checkbox" id="anim" checked> animate</label>
    </div>
  </aside>
  <section id="view">
    <div id="stack">
      <div id="art"></div>
      <img id="refimg" alt="">
      <div class="guide" data-g="eye"><span>eyes</span></div>
      <div class="guide" data-g="mouth"><span>mouth</span></div>
      <div class="guide" data-g="chin"><span>chin</span></div>
    </div>
    <details id="refcard">
      <summary>reference photo</summary>
      <div class="bar">
        <input type="file" id="reffile" accept="image/*">
        <label>fade <input type="range" id="refop" min="0" max="1" step="0.02" value="0.5"></label>
        <label>size <input type="range" id="refk" min="0.3" max="3" step="0.01" value="1"></label>
        <label>x <input type="range" id="refx" min="-200" max="200" step="1" value="0"></label>
        <label>y <input type="range" id="refy" min="-200" max="200" step="1" value="0"></label>
        <label><input type="checkbox" id="refg"> guides</label>
        <button id="refclear">clear</button>
      </div>
    </details>
    <details id="dbg">
      <summary>debug &amp; report</summary>
      <textarea id="note" rows="2" placeholder="what looks wrong? e.g. the hair on this character is bad / this shirt with this neck is bad"></textarea>
      <div class="bar"><button id="copyrep">copy report</button></div>
      <pre id="rep"></pre>
    </details>
  </section>
</main>
<script type="module">
  import { renderPortrait, eyeY, mouthY, CHIN_Y } from './web/visual/portrait.mjs';
  import { groupsFor, PALETTES, blank, params, encode, decode, setOv, at, labelOf, presetMatch, report, idle } from './web/visual/editor.mjs';

  const $ = (id) => document.getElementById(id);
  const panel = $('panel');
  const esc = (s) => String(s).replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
  const numeric = (c) => typeof c.options?.[0] === 'number';

  // the named palettes as colour-input swatches
  document.body.insertAdjacentHTML('beforeend', Object.entries(PALETTES).map(([k, v]) => `<datalist id="pal-${k}">${Object.values(v).map((h) => `<option value="${h}">`).join('')}</datalist>`).join(''));

  const opts = (c) => (c.options ?? []).filter((o) => !(c.kind === 'multi' && o === 'none')).map((o, i) => `<option value="${esc(o)}">${esc(c.labels?.[i] ?? o)}</option>`).join('');
  const nav = '<span class="nav"><button data-nav="-1" tabindex="-1">‹</button><button data-nav="1" tabindex="-1">›</button></span>'; // previous / next through the list, wrapping; the empty entry of a preset or a list slot is picked from the menu, never stepped onto
  function field(c, i, slot) {
    const a = `data-i="${i}"${slot === undefined ? '' : ` data-slot="${slot}"`}`;
    if (c.kind === 'num') return `<input ${a} type="range" min="${c.min}" max="${c.max}" step="${c.step}"><output></output>${c.nullable ? `<input class="auto" data-i="${i}" data-auto="1" type="checkbox" title="auto (the style's own value)">` : ''}`;
    if (c.kind === 'color') return `<input ${a} type="color"${c.palette ? ` list="pal-${c.palette}"` : ''}><span></span>${c.nullable ? `<input class="auto" data-i="${i}" data-auto="1" type="checkbox" title="auto (from the skin)">` : ''}`;
    if (c.kind === 'bool') return `<input ${a} type="checkbox"><span></span>`;
    if (c.kind === 'multi') return `<select ${a}><option value="">—</option>${opts(c)}</select>${nav}`;
    if (c.kind === 'preset') return `<select ${a}><option value="">—</option>${opts(c)}</select>${nav}`;
    return `<select ${a}>${opts(c)}</select>${nav}`;
  }
  // a row per control, and for the list parameters (details, makeup, marks, accessories, props: the portrait takes several at once) one plain dropdown per slot
  let st = location.hash.length > 1 ? decode(location.hash) : blank(), hash = '';
  // the panel is built from the state's groups (groupsFor: a theme adds its parts to the menus and a preset of its own), and rebuilt when the theme changes
  let controls = [], built = null;
  const row = (c, slot) => `<div class="row" data-p="${esc(c.path)}"><span title="${esc(c.path)}">${esc(labelOf(c))}${slot === undefined ? '' : ' ' + (slot + 1)}</span>${field(c, controls.indexOf(c), slot)}</div>`;
  function build() {
    const groups = groupsFor(st), open = Object.fromEntries([...panel.querySelectorAll('details.grp')].map((d, i) => [i, d.open]));
    controls = groups.flatMap((g) => g.items); built = st.theme;
    for (const d of panel.querySelectorAll('details.grp')) d.remove();
    panel.insertAdjacentHTML('beforeend', groups.map((g, gi) => `<details class="grp" ${(open[gi] ?? gi < 3) ? 'open' : ''}><summary>${g.name}</summary>${g.items.map((c) => c.kind === 'multi' ? [0, 1, 2, 3].map((k) => row(c, k)).join('') : row(c)).join('')}</details>`).join(''));
  }
  build();

  const slots = (i) => [...panel.querySelectorAll(`select[data-i="${i}"]`)]; // a list parameter's dropdowns, in order
  const read = (el, c) => c.kind === 'multi' ? [...new Set(slots(el.dataset.i).map((e) => e.value).filter(Boolean))]
    : c.kind === 'bool' ? (el.checked ? 1 : 0)
    : c.kind === 'num' ? +el.value
    : c.kind === 'enum' && numeric(c) ? +el.value : el.value;

  function apply(el, c) {
    if (el.dataset.auto) { // the auto box: null gives the value back to the style (or the skin)
      const v = el.checked ? null : read(panel.querySelector(`[data-i="${el.dataset.i}"]:not([data-auto])`), c);
      return setOv(st.ov, c.path, v);
    }
    const v = read(el, c);
    if (c.state) return void (st[c.state] = v);
    if (c.kind === 'preset') { if (v !== '') for (const [k, x] of Object.entries(c.apply(v))) setOv(st.ov, k, x); return; }
    if (c.nullable && v === 'none') return setOv(st.ov, c.clears ?? c.path, null);
    setOv(st.ov, c.path, v);
  }

  function sync(p) {
    if (built !== st.theme) build();
    for (const el of panel.querySelectorAll('[data-i]')) {
      const c = controls[+el.dataset.i], v = c.state ? st[c.state] : at(p, c.path);
      if (el.dataset.auto) { el.checked = v === null || v === undefined; continue; }
      if (c.kind === 'multi') { // a name another slot already wears is greyed out, since the two would collapse into one
        const worn = new Set((v ?? []).filter((_, k) => k !== +el.dataset.slot));
        for (const o of el.options) o.disabled = !!o.value && worn.has(o.value);
        el.value = (v ?? [])[+el.dataset.slot] ?? '';
      }
      else if (c.kind === 'bool') el.checked = !!v;
      else if (c.kind === 'preset') el.value = presetMatch(c, p);
      else if (c.kind === 'color') el.value = v ?? '#888888';
      else if (c.nullable && v == null) el.value = 'none';
      else el.value = v;
      if (c.kind === 'num') { el.disabled = c.nullable && v == null; el.nextElementSibling.value = el.disabled ? 'auto' : (+el.value).toFixed(String(c.step).includes('.') ? 2 : 0); }
      if (c.kind === 'color') el.disabled = c.nullable && v == null;
      el.closest('.row').classList.toggle('ov', (c.clears ?? c.path) in st.ov || c.path in st.ov);
    }
  }

  // the animate toggle: the sitter drifts as if bored (idle()), on top of whatever the controls say and writing nothing back
  let raf = 0, t0 = 0;
  const tick = (ms) => { if (!$('anim').checked) return; $('art').innerHTML = renderPortrait(idle(params(st), (ms - t0) / 1000)); raf = requestAnimationFrame(tick); };
  const animate = () => { cancelAnimationFrame(raf); if ($('anim').checked) { t0 = performance.now(); raf = requestAnimationFrame(tick); } else refresh(); };

  // the reference photo: a picture of the person laid over the drawing at a fade, moved and sized onto it, with the
  // three lines a likeness is actually judged on (the eye line, the mouth, the chin) drawn across both. Nothing here
  // touches the state: it is a way of looking, not a parameter of the face.
  const refImg = $('refimg');
  const placeRef = () => { refImg.style.opacity = $('refop').value; refImg.style.transform = `translate(calc(-50% + ${$('refx').value}px), ${$('refy').value}px) scale(${$('refk').value})`; };
  const guides = (p) => { const on = $('refg').checked, y = { eye: eyeY(p), mouth: mouthY(p), chin: CHIN_Y }; for (const g of document.querySelectorAll('.guide')) { g.style.display = on ? 'block' : 'none'; g.style.top = `${(y[g.dataset.g] / 480) * 100}%`; } };
  $('reffile').onchange = (e) => { const f = e.target.files[0]; if (!f) return; refImg.src = URL.createObjectURL(f); refImg.style.display = 'block'; placeRef(); };
  for (const id of ['refop', 'refk', 'refx', 'refy']) $(id).oninput = placeRef;
  $('refg').onchange = () => guides(params(st));
  $('refclear').onclick = () => { refImg.removeAttribute('src'); refImg.style.display = 'none'; };
  addEventListener('dragover', (e) => e.preventDefault());
  addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (!f || !f.type.startsWith('image/')) return; e.preventDefault(); $('refcard').open = true; refImg.src = URL.createObjectURL(f); refImg.style.display = 'block'; placeRef(); });

  function refresh() {
    const p = params(st);
    if (!$('anim').checked) $('art').innerHTML = renderPortrait(p);
    sync(p);
    guides(p);
    $('rep').textContent = report(st, $('note').value, location.href.split('#')[0] + '#' + encode(st));
  }
  const commit = () => { hash = encode(st); location.hash = hash; refresh(); }; // one history entry per committed edit, so Back walks the edits

  panel.addEventListener('input', (e) => { const c = controls[+e.target.dataset.i]; if (!c) return; apply(e.target, c); refresh(); });
  panel.addEventListener('click', (e) => { // the arrows step the dropdown they sit beside, wrapping, skipping a preset's own —
    const d = +(e.target.dataset.nav ?? 0); if (!d) return;
    const sel = e.target.closest('.row').querySelector('select'), n = sel.options.length, skip = ['preset', 'multi'].includes(controls[+sel.dataset.i].kind);
    let i = sel.selectedIndex;
    do { i = (i + d + n) % n; } while (i !== sel.selectedIndex && ((skip && sel.options[i].value === '') || sel.options[i].disabled));
    sel.selectedIndex = i;
    sel.dispatchEvent(new Event('input', { bubbles: true })); sel.dispatchEvent(new Event('change', { bubbles: true }));
  });
  panel.addEventListener('change', (e) => { if (controls[+e.target.dataset.i]) commit(); });
  $('note').addEventListener('input', refresh);
  $('anim').onchange = animate;
  $('rand').onclick = () => { st = { ...st, seed: Math.floor(Math.random() * 1e6), ov: {} }; commit(); };
  $('clear').onclick = () => { st = { ...st, ov: {} }; commit(); };
  $('reset').onclick = () => { st = blank(); commit(); };
  $('copy').onclick = () => navigator.clipboard.writeText(location.href.split('#')[0] + '#' + encode(st));
  // the face as a picture: the drawing rasterised on the page background (a transparent png reads as black wherever it is pasted), to the clipboard, or saved where the clipboard refuses it
  $('copyimg').onclick = async () => {
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent($('art').innerHTML.replace('<svg ', '<svg width="800" height="960" '));
    await img.decode();
    const c = Object.assign(document.createElement('canvas'), { width: 800, height: 960 }), ctx = c.getContext('2d');
    ctx.fillStyle = getComputedStyle(document.body).backgroundColor; ctx.fillRect(0, 0, 800, 960); ctx.drawImage(img, 0, 0);
    const png = await new Promise((r) => c.toBlob(r, 'image/png'));
    try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]); }
    catch { const a = document.createElement('a'); a.href = URL.createObjectURL(png); a.download = `portrait-${st.seed}.png`; a.click(); }
  };
  $('copyrep').onclick = () => navigator.clipboard.writeText($('rep').textContent);
  addEventListener('hashchange', () => { if (location.hash.slice(1) !== hash) { st = decode(location.hash); hash = location.hash.slice(1); refresh(); } });
  addEventListener('keydown', (e) => { if (e.target.matches('input, select, textarea')) return; if (e.key === '[' || e.key === ']') { st = { ...st, seed: Math.max(0, st.seed + (e.key === ']' ? 1 : -1)) }; commit(); } });

  hash = encode(st); history.replaceState(null, '', '#' + hash); refresh(); animate(); // the sitter is alive when the page opens
</script>
</body>
</html>
