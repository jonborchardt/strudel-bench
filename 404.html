<script>
  // github pages serves this file for any unknown path, at any depth, so relative links must resolve from the site root:
  // a project page lives under /<repo>/, so the root is the first path segment; anywhere else (localhost) it is the origin
  const root = location.hostname.endsWith('github.io') ? location.pathname.replace(/^(\/[^/]+\/).*$/, '$1') : location.origin + '/';

</script>
